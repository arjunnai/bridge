# config.example.toml — copy to config.toml to enable.
# codex-bridge intentionally REFUSES to load this file at runtime; copy it
# first:
#
#   cp config.example.toml config.toml
#   $EDITOR config.toml
#
# Discovery order at runtime:
#   1. $BRIDGE_CONFIG (explicit path)
#   2. ./config.toml
#   3. built-in defaults (codex, claude, kiro all map session=command=name)
#
# Schema is intentionally narrow: [github], [watch], [orchestration],
# [agents.<name>] with string or number values. Anything else is ignored.

[github]
repo = "OWNER/REPO"

[watch]
timeout_secs = 1200
quiet_secs   = 90
poll_secs    = 10

[orchestration]
orchestrator       = "claude"
implementer        = "kiro"
reviewer           = "codex"
phase_plan_file    = "BRIDGE_PHASE_PLAN.md"
# context_maintainer = "context"  # optional sidecar; fires post-completed, pre-merge

[agents.codex]
session         = "codex"
command         = "codex --yolo"
role            = "reviewer"
review_mode     = "adversarial"
prompt_template = "templates/reviewer-prompt.md"
github_login    = ""

[agents.claude]
session         = "claude"
command         = "claude"
role            = "orchestrator"
prompt_template = "templates/orchestrator-prompt.md"
github_login    = ""

[agents.kiro]
session         = "kiro"
command         = "kiro-cli chat --trust-all-tools --model claude-opus-4.7"
role            = "implementer"
prompt_template = "templates/implementer-prompt.md"
github_login    = ""

# Optional: docs-hygiene sidecar. Uncomment together with context_maintainer above.
# [agents.context]
